[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-bench"
version = "0.1.0"
description = "OpenClaw runtime benchmark tooling for SWE-bench style tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
soma-bench = "soma_bench.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]