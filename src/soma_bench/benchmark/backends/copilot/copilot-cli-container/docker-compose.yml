services:
  copilot:
    build: .
    image: local/copilot-cli:latest
    pull_policy: never
    env_file:
      - .env
    working_dir: /workspace
    volumes:
      - copilot-workspace:/workspace
      - copilot-home:/home/copilot
    networks:
      - copilot-sandbox
    stdin_open: true
    tty: true

  proxy:
    image: nginx:1.27-alpine
    environment:
      - COMPACT_BENCH_LLM_BASE_URL=${COMPACT_BENCH_LLM_BASE_URL}
      - COPILOT_PROXY_PORT=${COPILOT_PROXY_PORT:-8080}
    command:
      - /bin/sh
      - -lc
      - |
        cat <<EOF >/etc/nginx/conf.d/default.conf
        log_format soma_proxy '\$$remote_addr - \$$remote_user [\$$time_local] "\$$request" '
                              'status=\$$status bytes=\$$body_bytes_sent req_time=\$$request_time '
                              'upstream="\$$upstream_addr" upstream_status="\$$upstream_status" '
                              'upstream_time="\$$upstream_response_time" host="\$$host" uri="\$$request_uri"';

        server {
          listen ${COPILOT_PROXY_PORT:-8080};
          access_log /dev/stdout soma_proxy;
          error_log /dev/stderr info;
          location / {
            proxy_pass ${COMPACT_BENCH_LLM_BASE_URL};
            proxy_ssl_server_name on;
            proxy_ssl_name \$$proxy_host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host \$$proxy_host;
            proxy_set_header X-Forwarded-For \$$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$$scheme;
          }
        }
        EOF
        nginx -g "daemon off;"
    networks:
      - copilot-sandbox
      - copilot-egress

  compression-service:
    image: ${COPILOT_COMPRESSION_SERVICE_IMAGE:-soma-compression-service:latest}
    environment:
      - COMPRESSION_UPSTREAM_BASE_URL=${COMPRESSION_UPSTREAM_BASE_URL:-}
      - SOMA_COMPRESSION_SERVICE_UPSTREAM_BASE_URL=${SOMA_COMPRESSION_SERVICE_UPSTREAM_BASE_URL:-}
      - MINER_MODULE_PATH=/app/miner/base_miner.py
    volumes:
      - ${COPILOT_COMPRESSION_SCRIPT_PATH:-/dev/null}:/app/miner/base_miner.py:ro
    profiles:
      - copilot-sidecars
    networks:
      - copilot-sandbox

  swe-sandbox:
    image: ${COPILOT_SWE_SANDBOX_IMAGE:-alpine:3.20}
    volumes:
      - copilot-workspace:/testbed
    command:
      - /bin/sh
      - -lc
      - while true; do sleep 3600; done
    profiles:
      - copilot-sidecars
    networks:
      - copilot-sandbox

volumes:
  copilot-home:
  copilot-workspace:

networks:
  copilot-sandbox:
    internal: true
  copilot-egress: